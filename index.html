<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FYP Supervisor Portal 2023-27</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e3e7ed;--ac:#1f5eff;--nb:#eceff4;--er:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2b3441;--ac:#6b93ff;--nb:#252d39;--er:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.6}
.mu{color:var(--mu);font-size:13px}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);margin-bottom:18px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-size:12px}tr.k{cursor:pointer}tr.k:hover td{background:var(--nb)}.wrap{overflow-x:auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.stat b{font-size:24px;display:block}.stat span{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px}.id{font-size:12px;color:var(--mu)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stu{border-top:1px solid var(--bd);padding-top:8px;font-size:14px}.stu b{display:block}.roll{color:var(--mu);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--nb);color:var(--tx);text-decoration:none;word-break:break-all}.chip:hover{outline:1px solid var(--ac)}
.none{font-size:12px;color:var(--mu)}.empty{color:var(--mu);padding:30px;text-align:center}
.small{padding:4px 9px;font-size:12px}
</style></head><body>
<header><h1>FYP Supervisor Portal<small>Emerson University Multan · Session 2023-27</small></h1><div id="who"></div></header>
<main id="app"></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=[],S=[];
const wa=p=>'https://wa.me/92'+p.slice(1);
function chips(m){const c=[];
 m.email.forEach(e=>c.push(`<a class="chip" href="mailto:${esc(e)}">✉ ${esc(e)}</a>`));
 m.phone.forEach(p=>/^03\d{9}$/.test(p)?c.push(`<a class="chip" href="tel:${p}">📞 ${p}</a>`,`<a class="chip" href="${wa(p)}" target="_blank" rel="noopener">WhatsApp</a>`):c.push(`<span class="chip">📞 ${esc(p)}</span>`));
 return c.length?`<div class="chips">${c.join('')}</div>`:'<div class="none">No contact details on file</div>'}
async function init(){
 const j=await (await fetch('data/groups.json')).json();G=j.groups;S=j.supervisors.filter(s=>G.some(g=>g.supervisor===s));
 const secs=[...new Set(G.map(g=>g.section))].sort();
 $('app').innerHTML=`<div class="bar"><select id="sf"><option value="">All supervisors</option>${S.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
 <select id="cf"><option value="">All programs</option>${secs.map(s=>`<option>${s}</option>`).join('')}</select>
 <input id="q" placeholder="Search title, student, roll no…" style="flex:1;min-width:200px"><button id="ce">Copy emails of shown students</button></div>
 <div class="stats" id="st"></div><div id="tb"></div><div class="grid" id="gr"></div>`;
 const h=decodeURIComponent(location.hash.replace('#','')).replace(/^sup=/,'');if(S.includes(h))$('sf').value=h;
 ['sf','cf','q'].forEach(i=>$(i).oninput=()=>{if(i==='sf')history.replaceState(null,'',$('sf').value?'#sup='+encodeURIComponent($('sf').value):location.pathname);draw()});
 $('ce').onclick=()=>copy(vis(),$('ce'));draw()}
function vis(){const s=$('sf').value,c=$('cf').value,q=$('q').value.toLowerCase();
 return G.filter(g=>(!s||g.supervisor===s)&&(!c||g.section===c)&&(!q||(g.title+g.id+g.members.map(m=>m.name+m.roll).join(' ')).toLowerCase().includes(q)))}
function draw(){const L=vis(),sv=$('sf').value,st=L.reduce((a,g)=>a+g.members.length,0),noc=L.reduce((a,g)=>a+g.members.filter(m=>!m.email.length&&!m.phone.length).length,0);
 $('st').innerHTML=[[L.length,'Groups'],[st,'Students'],[noc,'Students without contact info']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 if(!sv&&!$('cf').value&&!$('q').value){$('tb').innerHTML=`<div class="wrap"><table><tr><th>Supervisor</th><th>Groups</th><th>Students</th></tr>${S.map(s=>{const gs=G.filter(g=>g.supervisor===s);return `<tr class="k" data-s="${esc(s)}"><td>${esc(s)}</td><td>${gs.length}</td><td>${gs.reduce((a,g)=>a+g.members.length,0)}</td></tr>`}).join('')}<tr><th>Total</th><th>${G.length}</th><th>${G.reduce((a,g)=>a+g.members.length,0)}</th></tr></table></div>`;
  $('tb').querySelectorAll('tr.k').forEach(t=>t.onclick=()=>{$('sf').value=t.dataset.s;$('sf').oninput();scrollTo(0,0)})}else $('tb').innerHTML='';
 $('gr').innerHTML=L.length?L.map(g=>`<div class="card"><div class="row"><span class="id">${g.id}${sv?'':' · '+esc(g.supervisor)}</span><button class="small" data-c="${g.id}">Copy emails</button></div>
  <h3>${esc(g.title||'Title not provided')}</h3>${g.members.map(m=>`<div class="stu"><b>${esc(m.name)}</b><span class="roll">${esc(m.roll)}</span>${chips(m)}</div>`).join('')}</div>`).join(''):'<div class="empty">No groups match.</div>';
 $('gr').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copy(G.filter(g=>g.id===b.dataset.c),b))}
function copy(gs,b){const e=[...new Set(gs.flatMap(g=>g.members.flatMap(m=>m.email)))];navigator.clipboard.writeText(e.join('; ')).then(()=>{const t=b.textContent;b.textContent=e.length?'Copied '+e.length:'No emails';setTimeout(()=>b.textContent=t,1500)})}
init().catch(()=>{$('app').innerHTML='<div class="empty">Could not load data/groups.json</div>'});
</script></body></html>
