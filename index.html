<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FYP Supervisor Portal 2023-27</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--ac:#4f46e5;--ac2:#0ea5e9;--nb:#f1f5f9;--hd1:#1e1b4b;--hd2:#4338ca;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--ac:#818cf8;--ac2:#38bdf8;--nb:#273449;--hd1:#0b1020;--hd2:#312e81;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--hd1),var(--hd2));color:#fff;padding:26px 20px 70px}
.hin{max-width:1000px;margin:0 auto;padding:0 16px}h1{font-size:26px;margin:0;letter-spacing:.2px}h1 small{display:block;font-weight:400;color:#c7d2fe;font-size:14px;margin-top:4px}
main{max-width:1000px;margin:-48px auto 0;padding:0 16px 60px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}button{cursor:pointer}button:hover{border-color:var(--ac);color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:var(--card);padding:12px;border-radius:14px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--ac)}.stat:nth-child(2){border-color:var(--ac2)}.stat:nth-child(3){border-color:#f59e0b}
.stat b{font-size:28px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto;border-radius:14px;box-shadow:var(--sh);margin-bottom:22px;background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:var(--nb)}
tr.k{cursor:pointer}tr.k:hover td{background:var(--nb)}tr:last-child th{border-bottom:0}
.grid{display:grid;gap:22px}
.group{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--bd);border-left:6px solid hsl(var(--h) 65% 50%)}
.gh{padding:16px 20px 14px;background:linear-gradient(90deg,hsl(var(--h) 80% 96%),transparent 85%)}
@media(prefers-color-scheme:dark){.gh{background:linear-gradient(90deg,hsl(var(--h) 40% 22%),transparent 85%)}}
.gtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.gtop .small{margin-left:auto}
.prog{font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h) 65% 45%);padding:3px 12px;border-radius:99px;letter-spacing:.3px}
.gno{font-size:13px;color:var(--mu)}.gsup{font-size:13px;color:var(--mu);padding-left:8px;border-left:1px solid var(--bd)}
.group h3{margin:10px 0 0;font-size:19px;font-weight:700;line-height:1.3}
.gb{padding:2px 20px 10px}
.stu{display:grid;grid-template-columns:24px minmax(150px,1.1fr) minmax(120px,.8fr) 2fr;gap:6px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--bd);font-weight:400}
.stu .n{color:var(--mu);font-size:12px}.sname{font-weight:400}.roll{color:var(--mu);font-size:13px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-weight:400}
.chip{font-size:13px;padding:4px 11px;border-radius:99px;background:var(--nb);color:var(--tx);text-decoration:none;word-break:break-all;border:1px solid var(--bd)}.chip:hover{border-color:var(--ac);color:var(--ac)}
.none{font-size:13px;color:var(--mu);font-style:italic}.empty{color:var(--mu);padding:40px;text-align:center;background:var(--card);border-radius:14px}
.small{padding:5px 12px;font-size:12px}
@media(max-width:700px){.stu{grid-template-columns:20px 1fr}.stu .roll{grid-column:2}.stu .chips{grid-column:1/-1}h1{font-size:21px}}
</style></head><body>
<header><div class="hin"><h1>FYP Supervisor Portal<small>Emerson University Multan · Session 2023-27</small></h1></div></header>
<main id="app"></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=[],S=[];const hueOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const wa=p=>'https://wa.me/92'+p.slice(1);
function chips(m){const c=[];
 m.email.forEach(e=>c.push(`<a class="chip" href="mailto:${esc(e)}">✉ ${esc(e)}</a>`));
 m.phone.forEach(p=>/^03\d{9}$/.test(p)?c.push(`<a class="chip" href="tel:${p}">📞 ${p}</a>`,`<a class="chip" href="${wa(p)}" target="_blank" rel="noopener">WhatsApp</a>`):c.push(`<span class="chip">📞 ${esc(p)}</span>`));
 return c.length?`<div class="chips">${c.join('')}</div>`:'<div class="chips"><span class="none">No contact details on file</span></div>'}
async function init(){
 const j=await (await fetch('data/groups.json')).json();G=j.groups;S=j.supervisors.filter(s=>G.some(g=>g.supervisor===s));
 const secs=[...new Set(G.map(g=>g.section))].sort();
 $('app').innerHTML=`<div class="bar"><select id="sf"><option value="">Select your name…</option>${S.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
 <select id="cf"><option value="">All programs</option>${secs.map(s=>`<option>${s}</option>`).join('')}</select>
 <input id="q" placeholder="Search title, student, roll no…" style="flex:1 1 240px"><button id="ce">Copy emails of shown students</button></div>
 <div class="stats" id="st"></div><div id="tb"></div><div class="grid" id="gr"></div>`;
 const h=decodeURIComponent(location.hash.replace('#','')).replace(/^sup=/,'');if(S.includes(h))$('sf').value=h;
 ['sf','cf','q'].forEach(i=>$(i).oninput=()=>{if(i==='sf')history.replaceState(null,'',$('sf').value?'#sup='+encodeURIComponent($('sf').value):location.pathname);draw()});
 $('ce').onclick=()=>copy(vis(),$('ce'));draw()}
function vis(){const s=$('sf').value,c=$('cf').value,q=$('q').value.toLowerCase();
 return G.filter(g=>(!s||g.supervisor===s)&&(!c||g.section===c)&&(!q||(g.title+g.id+g.members.map(m=>m.name+m.roll).join(' ')).toLowerCase().includes(q)))}
function draw(){const sv=$('sf').value;
 ['cf','q','ce'].forEach(i=>$(i).hidden=!sv);
 const tile=a=>a.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 if(!sv){$('cf').value='';$('q').value='';
  $('st').innerHTML=tile([[G.length,'Total groups'],[G.reduce((a,g)=>a+g.members.length,0),'Total students']]);
  $('tb').innerHTML='<div class="empty">Select your name from the supervisor list above to see your allocated groups and student contact details.</div>';$('gr').innerHTML='';return}
 $('tb').innerHTML='';
 const L=vis(),st=L.reduce((a,g)=>a+g.members.length,0),noc=L.reduce((a,g)=>a+g.members.filter(m=>!m.email.length&&!m.phone.length).length,0);
 $('st').innerHTML=tile([[L.length,'Groups'],[st,'Students'],[noc,'Students without contact info']]);
 $('gr').innerHTML=L.length?L.map(g=>{const no=g.id.split('-G').pop(),hue=hueOf(g.section);return `<section class="group" style="--h:${hue}">
  <div class="gh"><div class="gtop"><span class="prog">${esc(g.section)}</span><span class="gno">Group ${no}</span>${sv?'':`<span class="gsup">${esc(g.supervisor)}</span>`}<button class="small" data-c="${g.id}">Copy emails</button></div>
  <h3>${esc(g.title||'Title not provided')}</h3></div>
  <div class="gb">${g.members.map((m,i)=>`<div class="stu"><span class="n">${i+1}</span><div class="sname">${esc(m.name)}</div><div class="roll">${esc(m.roll)}</div>${chips(m)}</div>`).join('')}</div></section>`}).join(''):'<div class="empty">No groups match.</div>';
 $('gr').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copy(G.filter(g=>g.id===b.dataset.c),b))}
function copy(gs,b){const e=[...new Set(gs.flatMap(g=>g.members.flatMap(m=>m.email)))];navigator.clipboard.writeText(e.join('; ')).then(()=>{const t=b.textContent;b.textContent=e.length?'Copied '+e.length:'No emails';setTimeout(()=>b.textContent=t,1500)})}
init().catch(()=>{$('app').innerHTML='<div class="empty">Could not load data/groups.json</div>'});
</script></body></html>
